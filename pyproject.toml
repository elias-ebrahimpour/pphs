[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pphs"
version = "1.0.0"
description = "A polished developer-friendly static file server with a searchable file browser and code viewer."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PPHS Contributors"}]
keywords = ["http", "server", "static", "fileserver", "developer-tools", "cli", "directory-browser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities"
]
dependencies = ["typer>=0.12,<1.0", "Pygments>=2.17", "qrcode>=7.4,<8"]

[project.optional-dependencies]
markdown = ["Markdown>=3.6"]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]
all = ["Markdown>=3.6"]

[project.urls]
Homepage = "https://github.com/elias-ebrahimpour/pphs"
Repository = "https://github.com/elias-ebrahimpour/pphs"
Issues = "https://github.com/elias-ebrahimpour/pphs/issues"

[project.scripts]
pphs = "pphs.cli:main"

[tool.setuptools.packages.find]
include = ["pphs*"]

[tool.setuptools.package-data]
pphs = ["py.typed"]
